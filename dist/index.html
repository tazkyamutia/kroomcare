    <script>
      (function() {
        try {
          function getCookie(name) {
            try {
              var prefix = name + "=";
              var ca = document.cookie.split(';');
              for (var i = 0; i < ca.length; i++) {
                var c = ca[i].trim();
                if (c.indexOf(prefix) === 0) return c.substring(prefix.length, c.length);
              }
            } catch(e) {}
            return null;
          }

          var isEmbedded = false;
          try {
            isEmbedded = window.parent && window.parent !== window;
          } catch(e) {
            isEmbedded = true;
          }

          var cookieTheme = getCookie('kp_theme') || getCookie('kroombox_theme') || getCookie('theme') || getCookie('panel_theme') || getCookie('theme_mode');
          var isDark = false;

          var params = new URLSearchParams(window.location.search);
          var pTheme = params.get('theme') || params.get('mode') || params.get('themeMode') || params.get('colorScheme');

          if (pTheme === 'dark') {
            isDark = true;
          } else if (pTheme === 'light') {
            isDark = false;
          } else if (isEmbedded) {
            // When embedded in Kroombox Panel: ALWAYS prioritize panel theme!
            var parentDetected = null;
            try {
              if (window.parent && window.parent.document) {
                var pDoc = window.parent.document;
                var pHtml = pDoc.documentElement;
                var pBody = pDoc.body;
                var hasDarkIndicator = pHtml.classList.contains('dark') || 
                                       pHtml.classList.contains('theme-dark') || 
                                       pHtml.classList.contains('dark-mode') || 
                                       pHtml.classList.contains('night') ||
                                       (pBody && (pBody.classList.contains('dark') || pBody.classList.contains('theme-dark') || pBody.classList.contains('dark-mode') || pBody.classList.contains('night'))) || 
                                       pHtml.getAttribute('data-theme') === 'dark' || 
                                       pHtml.getAttribute('data-mode') === 'dark' || 
                                       pHtml.getAttribute('data-color-mode') === 'dark' || 
                                       (pBody && (pBody.getAttribute('data-theme') === 'dark' || pBody.getAttribute('data-mode') === 'dark' || pBody.getAttribute('data-color-mode') === 'dark'));
                parentDetected = hasDarkIndicator;
              }
            } catch(e) {}

            if (parentDetected !== null) {
              isDark = parentDetected;
              try { localStorage.setItem('kroombox_parent_theme', isDark ? 'dark' : 'light'); } catch(e) {}
            } else if (cookieTheme === 'dark' || cookieTheme === '1' || cookieTheme === 'true') {
              isDark = true;
            } else if (cookieTheme === 'light' || cookieTheme === '0' || cookieTheme === 'false') {
              isDark = false;
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              isDark = true;
            } else {
              isDark = false; // Default embedded mode to light matching Kroombox panel's light UI
            }
          } else {
            // Standalone mode: honor user's explicit preference or system media query
            var userMode = localStorage.getItem('kroomcare_theme_mode');
            if (userMode === 'dark') {
              isDark = true;
            } else if (userMode === 'light') {
              isDark = false;
            } else if (cookieTheme === 'dark') {
              isDark = true;
            } else if (cookieTheme === 'light') {
              isDark = false;
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              isDark = true;
            }
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          // Early language detection: Support Center follows panel, Standalone CRM uses independent setting
          var cookieLang = getCookie('kp_lang') || getCookie('kroombox_lang') || getCookie('lang');
          var urlLang = params.get('lang') || params.get('locale') || params.get('language');
          if (isEmbedded) {
            var activeLang = null;
            if (urlLang && urlLang.indexOf('en') === 0) activeLang = 'en';
            else if (urlLang && urlLang.indexOf('id') === 0) activeLang = 'id';
            else if (cookieLang && cookieLang.indexOf('en') === 0) activeLang = 'en';
            else if (cookieLang && cookieLang.indexOf('id') === 0) activeLang = 'id';
            if (activeLang) {
              document.documentElement.lang = activeLang;
              localStorage.setItem('kroombox_parent_lang', activeLang);
            }
          } else {
            var userLang = localStorage.getItem('kroomcare_lang');
            if (userLang === 'en' || userLang === 'id') {
              document.documentElement.lang = userLang;
            }
          }

          // Early message listener before bundle loads
          window.addEventListener('message', function(ev) {
            try {
              if (!ev || !ev.data) return;
              var d = ev.data;
              var incoming = null;
              if (typeof d === 'string' && (d === 'dark' || d === 'light')) incoming = d;
              else if (d.theme === 'dark' || d.theme === 'light') incoming = d.theme;
              else if (d.type === 'KROOMBOX_THEME_CHANGE' && (d.theme === 'dark' || d.theme === 'light')) incoming = d.theme;
              if (incoming) {
                localStorage.setItem('kroombox_parent_theme', incoming);
                if (incoming === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
              }

              // Language broadcast from parent
              if (d.type === 'KROOMBOX_LANG_CHANGE' || d.type === 'LANG_CHANGE' || d.type === 'LANGUAGE_CHANGE') {
                var langVal = (d.lang || d.language || '').toLowerCase();
                if (langVal.indexOf('en') === 0) {
                  document.documentElement.lang = 'en';
                  localStorage.setItem('kroombox_parent_lang', 'en');
                } else if (langVal.indexOf('id') === 0) {
                  document.documentElement.lang = 'id';
                  localStorage.setItem('kroombox_parent_lang', 'id');
                }
              }
            } catch(e) {}
          });
        } catch (e) {}
      })();
    </script>
