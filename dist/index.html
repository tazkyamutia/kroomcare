<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>KroomCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          function getCookie(name) {
            try {
              var prefix = name + "=";
              var ca = document.cookie.split(';');
              for (var i = 0; i < ca.length; i++) {
                var c = ca[i].trim();
                if (c.indexOf(prefix) === 0) return c.substring(prefix.length, c.length);
              }
            } catch(e) {}
            return null;
          }

          var isEmbedded = false;
          try {
            isEmbedded = window.parent && window.parent !== window;
          } catch(e) {
            isEmbedded = true;
          }

          var params = new URLSearchParams(window.location.search);
          var pTheme = params.get('theme') || params.get('mode') || params.get('themeMode') || params.get('colorScheme');
          var isDark = false;

          if (isEmbedded) {
            // Support Center inside Kroombox Panel:
            // ALWAYS prioritize Kroombox Panel's theme!
            var detected = null;
            try {
              if (window.parent && window.parent.document) {
                var pHtml = window.parent.document.documentElement;
                var pBody = window.parent.document.body;
                if (pHtml.classList.contains('dark') || (pBody && pBody.classList.contains('dark')) || pHtml.getAttribute('data-theme') === 'dark') {
                  detected = 'dark';
                } else {
                  detected = 'light';
                }
              }
            } catch(e) {}

            if (!detected) {
              var cTheme = getCookie('kp_theme') || getCookie('kroombox_theme') || getCookie('theme');
              if (cTheme === 'dark' || cTheme === 'light') detected = cTheme;
            }

            if (!detected && (pTheme === 'dark' || pTheme === 'light')) {
              detected = pTheme;
            }

            if (!detected) {
              try {
                var storedParent = localStorage.getItem('kroombox_parent_theme');
                if (storedParent === 'dark' || storedParent === 'light') detected = storedParent;
              } catch(e) {}
            }

            // Default to 'light' for embedded mode if not explicitly dark
            if (!detected) {
              detected = 'light';
            }

            isDark = (detected === 'dark');
            try {
              if (detected) localStorage.setItem('kroombox_parent_theme', detected);
            } catch(e) {}

            try {
              window.parent.postMessage({ type: 'GET_THEME' }, '*');
              window.parent.postMessage({ type: 'REQUEST_THEME' }, '*');
              window.parent.postMessage('getTheme', '*');
              window.parent.postMessage({ type: 'GET_LANGUAGE' }, '*');
            } catch(e) {}
          } else {
            // Standalone mode: check user preference or system preference
            var savedUserMode = null;
            try {
              var explicitUser = localStorage.getItem('kroomcare_theme_mode');
              if (explicitUser === 'dark' || explicitUser === 'light') {
                savedUserMode = explicitUser;
              }
            } catch(e) {}

            if (pTheme === 'dark') {
              isDark = true;
            } else if (pTheme === 'light') {
              isDark = false;
            } else if (savedUserMode === 'dark') {
              isDark = true;
            } else if (savedUserMode === 'light') {
              isDark = false;
            } else {
              // Standalone / Local mode defaults to Light Mode (matching Kroombox Panel)
              isDark = false;
            }
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }

          // Early language detection: Support Center follows panel, Standalone CRM uses independent setting
          var cookieLang = getCookie('kp_lang') || getCookie('kroombox_lang') || getCookie('lang');
          var urlLang = params.get('lang') || params.get('locale') || params.get('language');
          if (isEmbedded) {
            var activeLang = null;
            if (urlLang && urlLang.indexOf('en') === 0) activeLang = 'en';
            else if (urlLang && urlLang.indexOf('id') === 0) activeLang = 'id';
            else if (cookieLang && cookieLang.indexOf('en') === 0) activeLang = 'en';
            else if (cookieLang && cookieLang.indexOf('id') === 0) activeLang = 'id';
            if (activeLang) {
              document.documentElement.lang = activeLang;
              localStorage.setItem('kroombox_parent_lang', activeLang);
            }
          } else {
            var userLang = localStorage.getItem('kroomcare_lang');
            if (userLang === 'en' || userLang === 'id') {
              document.documentElement.lang = userLang;
            }
          }

          // Early message listener before bundle loads (active only when embedded in parent panel)
          if (isEmbedded) {
            window.addEventListener('message', function(ev) {
            try {
              if (!ev || !ev.data) return;
              var d = ev.data;
              var incoming = null;
              if (typeof d === 'string') {
                if (d === 'dark' || d === 'light') incoming = d;
                else if (d === 'theme:dark') incoming = 'dark';
                else if (d === 'theme:light') incoming = 'light';
                else if (d === 'mode:dark') incoming = 'dark';
                else if (d === 'mode:light') incoming = 'light';
              } else if (typeof d === 'object') {
                if (d.theme === 'dark' || d.theme === 'light') incoming = d.theme;
                else if (d.mode === 'dark' || d.mode === 'light') incoming = d.mode;
                else if (d.isDark === true) incoming = 'dark';
                else if (d.isDark === false) incoming = 'light';
                else if (d.type && (d.type.indexOf('THEME') !== -1 || d.type.indexOf('MODE') !== -1)) {
                  if (d.theme === 'dark' || d.theme === 'light') incoming = d.theme;
                  else if (d.mode === 'dark' || d.mode === 'light') incoming = d.mode;
                }
              }
              if (incoming) {
                localStorage.setItem('kroombox_parent_theme', incoming);
                if (incoming === 'dark') {
                  document.documentElement.classList.add('dark');
                  document.documentElement.setAttribute('data-theme', 'dark');
                  document.documentElement.style.colorScheme = 'dark';
                } else {
                  document.documentElement.classList.remove('dark');
                  document.documentElement.setAttribute('data-theme', 'light');
                  document.documentElement.style.colorScheme = 'light';
                }
              }

              // Language broadcast from parent
              if (d.type === 'KROOMBOX_LANG_CHANGE' || d.type === 'LANG_CHANGE' || d.type === 'LANGUAGE_CHANGE') {
                var langVal = (d.lang || d.language || '').toLowerCase();
                if (langVal.indexOf('en') === 0) {
                  document.documentElement.lang = 'en';
                  localStorage.setItem('kroombox_parent_lang', 'en');
                } else if (langVal.indexOf('id') === 0) {
                  document.documentElement.lang = 'id';
                  localStorage.setItem('kroombox_parent_lang', 'id');
                }
              }
            } catch(e) {}
          });
        }
      } catch (e) {}
    })();
  </script>
