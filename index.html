<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>KroomCare</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('kroomcare_theme_mode') || 'system';
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'system') {
            var params = new URLSearchParams(window.location.search);
            var pTheme = params.get('theme') || params.get('mode');
            if (pTheme === 'dark') {
              isDark = true;
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              isDark = true;
            }
            try {
              if (window.parent && window.parent !== window) {
                var p = window.parent.document;
                if (
                  p.documentElement.classList.contains('dark') || 
                  p.body.classList.contains('dark') || 
                  p.documentElement.getAttribute('data-theme') === 'dark' ||
                  p.body.getAttribute('data-theme') === 'dark'
                ) {
                  isDark = true;
                }
              }
            } catch(e) {}
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
