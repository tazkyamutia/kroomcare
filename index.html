<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>KroomCare</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('kroomcare_theme_mode') || 'system';
          var isDark = false;
          var isEmbedded = false;
          try {
            isEmbedded = window.parent && window.parent !== window;
          } catch(e) {
            isEmbedded = true;
          }

          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'light') {
            isDark = false;
          } else {
            // Mode is 'system': check URL parameters first
            var params = new URLSearchParams(window.location.search);
            var pTheme = params.get('theme') || params.get('mode') || params.get('themeMode') || params.get('colorScheme');
            if (pTheme === 'dark') {
              isDark = true;
            } else if (pTheme === 'light') {
              isDark = false;
            } else if (isEmbedded) {
              // Embedded inside Kroombox Panel iframe: inspect parent document if accessible
              var detectedParentDark = false;
              try {
                if (window.parent && window.parent.document) {
                  var pDoc = window.parent.document;
                  var pHtml = pDoc.documentElement;
                  var pBody = pDoc.body;
                  if (
                    pHtml.classList.contains('dark') || 
                    pBody.classList.contains('dark') || 
                    pHtml.getAttribute('data-theme') === 'dark' ||
                    pHtml.getAttribute('data-mode') === 'dark' ||
                    pBody.getAttribute('data-theme') === 'dark' ||
                    pBody.classList.contains('night')
                  ) {
                    detectedParentDark = true;
                  }
                }
              } catch(e) {
                // Cross-origin: Kroombox Panel default is light mode
                detectedParentDark = false;
              }
              isDark = detectedParentDark;
            } else {
              // Standalone direct window: follow OS prefers-color-scheme
              if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                isDark = true;
              }
            }
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
